# ============================================================
# 任务清单项目配置文件
# 数据库连接信息集中写在这里，Java 代码里不出现任何账号密码。
# 下面的 ${XXX:默认值} 表示：优先读环境变量，没有就用冒号后的默认值。
# ============================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: task-manager

  datasource:
    # useUnicode/characterEncoding：正确处理中文
    # useSSL=false：本地学习环境关闭 SSL，生产环境请按实际情况开启
    # serverTimezone=Asia/Shanghai：解决时区问题
    url: "${DB_URL:jdbc:mysql://localhost:3306/task_manager?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:task_app}"
    password: "${DB_PASSWORD:TaskApp@123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 表由 sql/02_create_table.sql 创建，这里不要让 Hibernate 自动改表结构
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      # LocalDateTime 输出成字符串，而不是时间戳数字
      write-dates-as-timestamps: false

# 控制台打印 SQL，方便学习时观察 JPA 生成了什么语句
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
